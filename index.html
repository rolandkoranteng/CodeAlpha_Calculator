<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Modern Calculator | CodeAlpha Task 2</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div class="background-decorations" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <main class="calculator-app">
    <!-- Calculator Card -->
    <section class="calculator-card" role="region" aria-label="Calculator">
      <!-- Top Bar Controls -->
      <header class="calc-header">
        <div class="brand">
          <span class="badge">CALC</span>
          <span class="brand-text">Pro</span>
        </div>
        <div class="header-actions">
          <!-- Sound Toggle -->
          <button id="soundToggle" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle Sound Feedback">
            <svg class="icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg class="icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- History Toggle -->
          <button id="historyToggle" class="icon-btn" title="Calculation History" aria-label="Calculation History">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>

          <!-- Theme Toggle -->
          <button id="themeToggle" class="icon-btn" title="Toggle Theme (Dark / Light)" aria-label="Toggle Theme">
            <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display Screen -->
      <section class="display-section" id="displaySection" title="Click to copy result">
        <!-- Expression Line -->
        <div class="expression-line" id="expressionDisplay" aria-live="polite"></div>
        <!-- Main Value Line -->
        <div class="main-display-container">
          <span class="main-display" id="mainDisplay" aria-live="assertive">0</span>
        </div>
        <!-- Real-time Result Preview Line -->
        <div class="preview-line" id="previewDisplay" aria-live="polite"></div>
        <!-- Copy feedback tooltip -->
        <span class="copy-badge" id="copyBadge">Copied!</span>
      </section>

      <!-- Keypad Grid -->
      <div class="keypad" role="grid" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button class="btn btn-action" data-action="clear" data-key="Escape" title="Clear All (Esc)">AC</button>
        <button class="btn btn-action" data-action="delete" data-key="Backspace" title="Backspace (Del)">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="btn btn-action" data-operator="%" data-key="%" title="Percentage / Modulo (%)">%</button>
        <button class="btn btn-operator" data-operator="/" data-key="/" title="Divide (/)">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-number" data-number="7" data-key="7">7</button>
        <button class="btn btn-number" data-number="8" data-key="8">8</button>
        <button class="btn btn-number" data-number="9" data-key="9">9</button>
        <button class="btn btn-operator" data-operator="*" data-key="*" title="Multiply (*)">×</button>

        <!-- Row 3 -->
        <button class="btn btn-number" data-number="4" data-key="4">4</button>
        <button class="btn btn-number" data-number="5" data-key="5">5</button>
        <button class="btn btn-number" data-number="6" data-key="6">6</button>
        <button class="btn btn-operator" data-operator="-" data-key="-" title="Subtract (-)">−</button>

        <!-- Row 4 -->
        <button class="btn btn-number" data-number="1" data-key="1">1</button>
        <button class="btn btn-number" data-number="2" data-key="2">2</button>
        <button class="btn btn-number" data-number="3" data-key="3">3</button>
        <button class="btn btn-operator" data-operator="+" data-key="+" title="Add (+)">+</button>

        <!-- Row 5 -->
        <button class="btn btn-number btn-negate" data-action="negate" data-key="n" title="Negate value (±)">±</button>
        <button class="btn btn-number" data-number="0" data-key="0">0</button>
        <button class="btn btn-number" data-action="decimal" data-key="." title="Decimal point (.)">.</button>
        <button class="btn btn-equal" data-action="calculate" data-key="Enter" title="Calculate (Enter or =)">=</button>
      </div>

      <!-- Quick Shortcuts Footer -->
      <footer class="calc-footer">
        <span class="keyboard-hint"><kbd>⌨</kbd> Keyboard Supported: [0-9] [+-*/] [Enter] [Esc] [Del]</span>
      </footer>

      <!-- History Slide-over Drawer -->
      <div class="history-panel" id="historyPanel" aria-hidden="true">
        <div class="history-header">
          <h3>History</h3>
          <div class="history-header-actions">
            <button id="clearHistoryBtn" class="text-btn danger" title="Clear all history">Clear</button>
            <button id="closeHistoryBtn" class="icon-btn small" title="Close History">✕</button>
          </div>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-empty">No calculations yet</div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
